[workspace]
members = [".", "nosh-context"]
exclude = ["vendor/brush-core"]

[patch.crates-io]
brush-core = { path = "vendor/brush-core" }

[package]
name = "nosh"
version = "1.6.1"
edition = "2024"
description = "Natural language shell powered by AI"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustyline = "19"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.29"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
indicatif = "0.18.6"
open = "5"
anyhow = "1"
dirs = "6"
shell-words = "1"
toml = "1.1.8"
brush-core = "0.5.0"
brush-builtins = "0.2.0"
brush-parser = "0.4"
hostname = "0.4"
regex = "1"
nosh-context = { path = "nosh-context" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
termimad = "0.35.5"
nix = { version = "0.31.3", features = ["signal", "term", "process"] }
libc = "0.2"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
